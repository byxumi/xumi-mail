name: Deploy xumi-mail to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Build Vue3 frontend (web)
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          CI: true

      - name: Type check
        run: npm run typecheck
        env:
          CI: true

      - name: Core tests
        run: npm test
        env:
          CI: true

      # 幂等：CREATE TABLE IF NOT EXISTS，全新部署时保证表结构存在
      - name: Init D1 schema
        run: npx wrangler d1 execute xumi-mail-db --remote --file=db/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CI: true

      - name: Next.js build
        timeout-minutes: 15
        run: npx next build
        env:
          CI: true

      - name: Build Worker (OpenNext)
        timeout-minutes: 10
        # 先执行 patch 脚本注入 cloudflare: external 插件，再进行 OpenNext 构建
        run: npm run build:worker
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        # 基于 wrangler.jsonc 部署（全新 Worker xumi-mail + D1 + KV + assets）
        # ADMIN_PASSWORDS 从 GitHub Actions Secret 注入（不进公开仓库），
        # 配合 keep_vars: true，后续部署也会保留该变量
        run: npx wrangler deploy --var ADMIN_PASSWORDS:"${{ secrets.ADMIN_PASSWORDS }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CI: true